[package]
name = "memoria"
version = "0.1.0"
edition = "2021"
description = "The Black Box for Your Black Box: Immutable, out-of-band action ledger and flight recorder for autonomous AI agents."
authors = ["Mallard <dev@mallard.sh>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/mallard/memoria"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.10"
