[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memoria-ai"
version = "0.1.0"
description = "The Black Box for Your Black Box: Immutable, out-of-band action ledger and flight recorder for autonomous AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mallard", email = "dev@mallard.sh" }
]
keywords = ["ai-agents", "security", "audit", "observability", "flight-recorder", "mcp", "llm-alignment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/mallard/memoria"
Repository = "https://github.com/mallard/memoria"

[project.scripts]
memoria = "memoria.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["memoria*"]
